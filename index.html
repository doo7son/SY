<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교 영단어 대항전! - Vocab Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <img src="SY.png" alt="SY Logo" class="main-logo">
            <h1>영단어 스피드 퀴즈!</h1>
            <p>60초 동안 누가 더 많이 맞출까요?</p>
        </header>

        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <div class="input-group">
                <select id="player-class" class="select-input">
                    <option value="" disabled selected>학급 선택</option>
                    <option value="1-1">1학년 1반</option>
                    <option value="1-2">1학년 2반</option>
                    <option value="1-3">1학년 3반</option>
                    <option value="1-4">1학년 4반</option>
                    <option value="1-5">1학년 5반</option>
                    <option value="1-6">1학년 6반</option>
                    <option value="1-7">1학년 7반</option>
                    <option value="1-8">1학년 8반</option>
                </select>
                <input type="text" id="player-name" placeholder="이름을 입력하세요" maxlength="10">
                <button id="start-btn" class="btn primary">퀴즈 시작!</button>
            </div>
            <div class="leaderboard-container">
                <div class="leaderboard">
                    <h3>🏆 학급별 총점 순위</h3>
                    <ul id="class-leaderboard-list">
                        <!-- Class totals will be added here -->
                    </ul>
                </div>
                <div class="leaderboard">
                    <h3>👤 개인 순위 (Top 10)</h3>
                    <ul id="leaderboard-list">
                        <!-- Individual items will be added here -->
                    </ul>
                </div>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen hidden">
            <div class="stats">
                <div class="stat-item">시간: <span id="timer">60</span>s</div>
                <div class="stat-item">점수: <span id="score">0</span></div>
            </div>
            
            <div class="quiz-container">
                <div id="word-display">Word</div>
                <div id="options-grid" class="options-grid">
                    <!-- 4 buttons will be generated here -->
                </div>
            </div>
            <div id="feedback" class="feedback"></div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen hidden">
            <h2>게임 종료!</h2>
            <div class="final-score">최종 점수: <span id="final-score-val">0</span>점</div>
            <button id="restart-btn" class="btn secondary">다시 도전하기</button>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
