<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교 클릭 대항전! - School Clicker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏫 학교 클릭 대항전!</h1>
            <p>10초 동안 누가 더 많이 클릭할까요?</p>
        </header>

        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <div class="input-group">
                <input type="text" id="player-name" placeholder="이름을 입력하세요 (예: 홍길동)" maxlength="10">
                <button id="start-btn" class="btn primary">게임 시작!</button>
            </div>
            <div class="leaderboard">
                <h3>🏆 현재 순위표</h3>
                <ul id="leaderboard-list">
                    <!-- Leaderboard items will be added here via JS -->
                </ul>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen hidden">
            <div class="stats">
                <div class="stat-item">시간: <span id="timer">10</span>s</div>
                <div class="stat-item">점수: <span id="score">0</span></div>
            </div>
            <button id="click-btn" class="click-target">클릭하세요!!</button>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen hidden">
            <h2>게임 종료!</h2>
            <div class="final-score">내 최종 점수: <span id="final-score-val">0</span>점</div>
            <p id="rank-message"></p>
            <button id="restart-btn" class="btn secondary">다시 도전하기</button>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
